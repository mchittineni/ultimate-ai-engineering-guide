name: 🆕 New question
description: Suggest an interview question this guide does not answer yet.
title: "[question] "
labels: ["new-question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for improving the guide. Before filing, please search the repository for the question - most topics already cover the common phrasings, and the answer may exist under a different wording.

        If you already have the answer written, you can skip this and open a pull request directly; see [CONTRIBUTING.md](https://github.com/mchittineni/ultimate-ai-engineering-guide/blob/main/CONTRIBUTING.md).

  - type: input
    id: question
    attributes:
      label: The question
      description: Phrase it the way an interviewer would ask it. Question files are titled as questions, so this becomes the title of the answer.
      placeholder: How do you optimize Time to First Token (TTFT) vs Time Per Output Token (TPOT) in vLLM?
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Which topic does it belong to?
      description: The directory the answer should live in. Pick the closest match - a maintainer will confirm.
      options:
        - llm-fundamentals
        - prompt-engineering
        - rag-and-vector-databases
        - ai-agents-and-mcp
        - fine-tuning-and-adaptation
        - ai-system-design
        - llmops-and-production-ai
        - evaluation-and-testing
        - ai-safety-and-governance
        - interview-experience
        - "Not sure / needs a new topic"
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Roughly the level of candidate this is asked of.
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is it worth adding?
      description: Where you have seen it asked, how often, and what the existing answers do not cover. "Asked in three of my last five interviews" is the strongest case.
      placeholder: |
        Asked in recent AI System Design screens. The existing serving answer covers basic batching but does not dive into PagedAttention or Speculative Decoding mechanics.
    validations:
      required: true

  - type: textarea
    id: draft
    attributes:
      label: Draft answer (optional)
      description: Even rough bullets help. Mechanism, one trade-off, and a command or snippet is enough to work from.
      placeholder: |
        - TTFT is bottlenecked by prompt processing (prefill phase) and KV cache allocation.
        - TPOT is bottlenecked by token generation (decode phase) and GPU memory bandwidth.
        - Use chunked prefill, spec decoding, and PagedAttention to optimize both.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the repository and this question is not already answered under a different wording.
          required: true
        - label: This is a technical question, not content covered by an NDA or a take-home assignment.
          required: true